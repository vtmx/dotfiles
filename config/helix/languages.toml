[language-server.bash]
command = 'bash-language-server'
args = ['--stdio']

[language-server.emmet]
command = 'emmet-language-server'
args = ['--stdio']

[language-server.go]
command = 'gopls'

[[language]]
name = 'bash'
language-servers = ['bash']
file-types = ['bash', 'sh', { glob = 'tmux.conf' }]
indent = { tab-width = 2, unit = '  ' }

[[language]]
name = 'css'
language-servers = ['emmet']
file-types = ['css', 'scss']
indent = { tab-width = 2, unit = '  ' }

[[language]]
name = 'html'
language-servers = ['emmet']
file-types = ['html']
indent = { tab-width = 2, unit = '  ' }

[[language]]
name = 'go'
language-servers = ['go']
indent = { tab-width = 2, unit = '  ' }

[[language]]
name = 'lua'
indent = { tab-width = 2, unit = '  ' }

[language-server.emmet-lsp]
command = '/home/vitor/.local/share/nvim/mason/bin/emmet-language-server'
args = ['--stdio']

[[language]]
name = 'bash'
file-types = ['bash', 'sh']
indent = { tab-width = 2, unit = '  ' }

[[language]]
name = 'css'
file-types = ['css', 'scss']
indent = { tab-width = 2, unit = '  ' }

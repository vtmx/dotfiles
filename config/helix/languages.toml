[language-server.bash]
command = '/home/vitor/.local/share/nvim/mason/bin/bash-language-server'
args = ['--stdio']

[language-server.emmet]
command = '/home/vitor/.local/share/nvim/mason/bin/emmet-language-server'
args = ['--stdio']

[[language]]
name = 'bash'
language-servers = ['bash']
file-types = ['bash', 'sh']
indent = { tab-width = 2, unit = '  ' }

[[language]]
name = 'css'
language-servers = ['emmet']
file-types = ['css', 'scss']
indent = { tab-width = 2, unit = '  ' }

[[language]]
name = 'html'
language-servers = ['emmet']
file-types = ['html']
indent = { tab-width = 2, unit = '  ' }

[[language]]
name = 'go'
indent = { tab-width = 2, unit = '  ' }

[[language]]
name = 'lua'
indent = { tab-width = 2, unit = '  ' }

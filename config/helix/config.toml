theme = 'onedarkv'

[editor]
auto-completion = true
auto-pairs = false
bufferline = 'multiple'
cursorline = true
default-yank-register = '+'
end-of-line-diagnostics = 'hint'
gutters = ['line-numbers', 'spacer']
line-number = 'relative'
shell = ['bash', '-c']

[editor.cursor-shape]
insert = 'bar'

[editor.indent-guides]
character = '▎'
render = true

[editor.lsp]
display-color-swatches = false

[editor.whitespace]
characters.newline = '↲'

[editor.statusline]
left = ['mode', 'file-name']
center = []
right = ['diagnostics', 'position', 'file-encoding']

[keys.normal]
'ç' = 'command_mode'
C-r = [':w', ':config-reload']
space.i = ':tree-sitter-highlight-name'

[keys.insert]
k = { j = 'normal_mode' }
C-c = 'normal_mode'
C-s = [':w', 'normal_mode']

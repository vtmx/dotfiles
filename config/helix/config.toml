theme = 'onedarkv'

[editor]
auto-completion = true
auto-pairs = false
bufferline = 'multiple'
cursorline = true
default-yank-register = '+'
end-of-line-diagnostics = 'hint'
gutters = ['line-numbers', 'spacer']
line-number = 'relative'
shell = ['bash', '-c']
scrolloff = 8

[editor.cursor-shape]
insert = 'bar'

[editor.indent-guides]
character = '▎'
render = true

[editor.lsp]
display-color-swatches = false

[editor.whitespace]
characters.newline = '↲'

[editor.statusline]
left = ['mode', 'file-name']
center = []
right = ['diagnostics', 'position', 'file-encoding']

[keys.normal]
'ç' = 'command_mode'
D = ['extend_to_line_end', 'yank_main_selection_to_clipboard', 'delete_selection']
G = 'goto_last_line'
H = 'extend_to_line_start'
L = 'extend_to_line_end'
V = ['select_mode', 'extend_to_line_bounds']
Y = ['save_selection', 'extend_to_line_end', 'yank_main_selection_to_clipboard', 'collapse_selection', 'jump_backward']
C-r = [':w', ':config-reload']

[keys.insert]
C-c = 'normal_mode'
C-s = [':w', 'normal_mode']

[keys.select]
'ç' = 'command_mode'
H = 'goto_line_start'
L = 'goto_line_end'

[keys.normal.space]
i = ':tree-sitter-highlight-name'
o = 'add_newline_below'
O = 'add_newline_above'
p = ['save_selection', 'open_below', 'normal_mode', 'paste_before', 'jump_backward']
P = ['save_selection', 'open_above', 'normal_mode', 'paste_before', 'jump_backward']

[keys.normal.space.u]
l = ':toggle whitespace.render all none'
n = ':toggle gutters.layout ["spacer"] ["line-numbers", "spacer"]'
w = ':toggle soft-wrap.enable'

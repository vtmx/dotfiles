theme = 'onedarkv'

[editor]
auto-completion = true
auto-pairs = true
bufferline = 'multiple'
color-modes = true
cursorline = true
default-yank-register = '+'
end-of-line-diagnostics = 'hint'
gutters = ['line-numbers', 'spacer']
line-number = 'relative'
shell = ['bash', '-c']

[editor.cursor-shape]
insert = 'bar'

[editor.indent-guides]
character = '▎'
render = true

[editor.whitespace.characters]
space = '·'
nbsp = '⍽'
nnbsp = '␣'
tab = '→'
newline = '↲'

[editor.statusline]
left = ['mode', 'file-name']
center = []
right = ['diagnostics', 'position', 'file-encoding']

[keys.normal]
'ç' = 'command_mode'
C-r = [':w', ':config-reload']
X = 'extend_line_above'

[keys.insert]
k = { j = 'normal_mode' }
C-c = 'normal_mode'
